name: shfmt
target:
  registry: ocx.sh
  repository: shfmt

source:
  type: github_release
  owner: mvdan
  repo: sh
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

assets:
  linux/amd64:
    - "shfmt_v.*_linux_amd64$"
  linux/arm64:
    - "shfmt_v.*_linux_arm64$"
  # darwin/amd64, darwin/arm64, windows/amd64 disabled while iterating;
  # plan/prepare/push key off `assets:` so dropping them here is what
  # actually saves runner minutes (commenting in `platforms:` alone left
  # the prepare matrix still emitting bundles, which push then flagged as
  # `missing_junit`). Re-enable in lockstep with the `platforms:` block.
  # darwin/amd64:
  #   - "shfmt_v.*_darwin_amd64$"
  # darwin/arm64:
  #   - "shfmt_v.*_darwin_arm64$"
  # windows/amd64:
  #   - "shfmt_v.*_windows_amd64\\.exe$"

asset_type:
  type: binary
  name: shfmt

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "3.5.0"
  new_per_run: 1
  poll_interval: "0 */6 * * *"

verify:
  github_asset_digest: true

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# ── Test pipeline (S1–S10) ─────────────────────────────────────────────────

tests:
  - name: version
    command: shfmt --version

platforms:
  # Stage D: all 4 native platforms + linux containers. Alpine container
  # leg added in Stage E (musl cross-compile).
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - image: ubuntu:24.04
        shell: bash
      - image: alpine:3.20
        shell: sh
  linux/arm64:
    runner: ubuntu-24.04-arm
    containers:
      - image: ubuntu:24.04
        shell: bash
  # darwin/amd64, darwin/arm64, windows/amd64 disabled while iterating
  # on the Discord notify pipeline — runner minutes saved, test results
  # for these platforms already validated in run 25851374043.
  # darwin/amd64:
  #   runner: macos-14  # Rosetta2 emulates x86_64 (macos-13 deprecated Sep 2026)
  # darwin/arm64:
  #   runner: macos-14
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh

ocx_mirror:
  release_tag: v0.2.1

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
